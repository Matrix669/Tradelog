services:
  db:
    image: postgres:18
    container_name: tradelog-db
    environment:
      POSTGRES_USER: tradelog
      POSTGRES_PASSWORD: tradelog_dev
      POSTGRES_DB: tradelog
    ports:
      - "5432:5432"
    volumes:
      - tradelog-pgdata:/var/lib/postgresql

volumes:
  tradelog-pgdata:
